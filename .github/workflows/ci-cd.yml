name: CI/CD Pipeline - Gestión de Productos

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Pruebas Unitarias y Validación de Despliegue
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas unitarias con Jest
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: jwt_secret_key_fullstack_app_2026

      - name: Confirmar despliegue continuo en Vercel
        run: echo "Pruebas superadas. Despliegue automático sincronizado con Vercel."
        